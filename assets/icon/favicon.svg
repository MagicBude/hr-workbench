<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="HR Workbench 图标">
  <!-- 圆角方底：品牌主色 -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#185FA5"/>

  <!-- 日历白页 -->
  <rect x="16" y="18" width="32" height="30" rx="5" fill="#ffffff"/>

  <!-- 顶部装订条 -->
  <rect x="18" y="20" width="28" height="7" rx="3.5" fill="#dbe6f1"/>

  <!-- 两个装订环（穿过顶部） -->
  <rect x="25" y="13" width="4" height="10" rx="2" fill="#ffffff"/>
  <rect x="35" y="13" width="4" height="10" rx="2" fill="#ffffff"/>

  <!-- 日期小圆点（左上、右上格） -->
  <circle cx="24" cy="33" r="2" fill="#cbd5e1"/>
  <circle cx="40" cy="33" r="2" fill="#cbd5e1"/>

  <!-- 日历格线（淡灰） -->
  <line x1="32" y1="29" x2="32" y2="47" stroke="#e5e7eb" stroke-width="2"/>
  <line x1="18" y1="37" x2="46" y2="37" stroke="#e5e7eb" stroke-width="2"/>

  <!-- 绿色对勾：打卡 / 考勤完成 -->
  <path d="M36 42 l3 3 l6 -7" fill="none" stroke="#1d9e75" stroke-width="3.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
